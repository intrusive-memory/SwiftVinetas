  - prompt: "Over-the-shoulder shot from behind a woman — she is a dark silhouette filling the left side of frame, hands on hips, housecoat like armor. A man faces her, small in frame by contrast. His expression is forced innocence masking pure contempt. The power dynamic is visible in the composition — she dominates the frame."
