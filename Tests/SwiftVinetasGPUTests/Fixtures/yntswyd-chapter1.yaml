  - prompt: "A man alone at a microphone on a dark stage, caught in a single harsh spotlight. His face is hollow — singing but not present. Eyes unfocused, staring past the audience into nothing. The spotlight makes his face stark white against the pure black void behind him. The audience is barely suggested shapes in darkness."
