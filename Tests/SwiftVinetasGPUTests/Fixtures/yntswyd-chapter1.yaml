  - prompt: "A man stands before a full-length mirror in tiny translucent running shorts. He pinches his belly fat with one hand, scowling at his reflection. His body language radiates self-doubt — shoulders slightly hunched, chin down. The mirror creates a stark doubled image. High contrast lighting from one side."
