name: PixArt Integration

# Exercises the PixArt-Sigma pipeline against REAL model weights in CI:
# Checkpoint 1 (the dependency graph + Metal kernels compile) and Checkpoint 2
# (the int4 PixArt components download from the CDN, verify against their
# manifests, and the engine assembles the pipeline with real weights).
#
# How it works:
#   - SwiftAcervo downloads PixArt's components (T5 int4 + DiT int4 + SDXL VAE,
#     ~3.5 GB total) from the public R2 CDN. `vinetas download` honors the
#     ACERVO_MODELS_DIR override, so weights land in a cacheable workspace dir
#     instead of the App Group container — sidestepping the MACF sandbox and
#     making `link-test-models` unnecessary.
#   - The dir is cached via actions/cache, keyed on the three CDN manifest
#     checksums, so the ~3.5 GB download only happens on the first run (and
#     re-runs automatically when a model is republished).
#   - The test reads weights from the same ACERVO_MODELS_DIR. GitHub's free
#     runner under-reports RAM (7 GB) vs. PixArt's 8 GB gate, so CI sets
#     VINETAS_TEST_IGNORE_MEMORY_GATE=1 to let the download/assembly checkpoints
#     run; int4 PixArt fits comfortably.
#
# SCOPE — Checkpoints 1 & 2 only. The image-GENERATION checkpoints (3 & 4,
# tagged .gpu) are intentionally excluded: GitHub-hosted runners expose a
# paravirtualized GPU that runs MLX correctly but is orders of magnitude too
# slow — a ~10 s generation on real Apple Silicon did not clear the T5 encoder
# in 5 minutes here (empirically measured, 2026-06-22). MLX itself compiles and
# runs fine on macos-26 now (the older `deferred-static-alloca-size` blocker is
# gone); the wall is GPU speed, not Metal support. Real-generation gating (incl.
# the garbage-output #39 regression) needs a SELF-HOSTED Apple-Silicon runner —
# tracked separately, alongside Flux2 (whose ~7.9 GB footprint also wants the
# persistent disk a self-hosted runner provides).

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  ACERVO_APP_GROUP_ID: group.intrusive-memory.models
  # SwiftAcervo 0.21.0+ has no hardcoded CDN default — vinetas download (and any
  # shell step that touches the CDN) traps without this. Forwarded to the xctest
  # runner separately via TEST_RUNNER_ACERVO_CDN_BASE_URL below.
  ACERVO_CDN_BASE_URL: https://cdn.intrusive-memory.productions/models
  MODELS_DIR: ${{ github.workspace }}/.pixart-models
  DERIVED_DATA: /tmp/SwiftVinetasBuild

concurrency:
  group: pixart-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixart-integration:
    name: PixArt Integration (macOS)
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runner diagnostics (RAM / GPU / toolchain)
        run: |
          RAM_BYTES=$(sysctl -n hw.memsize)
          RAM_GB=$((RAM_BYTES / 1073741824))
          echo "## PixArt Integration — runner diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- **RAM:** ${RAM_GB} GB (PixArt requires 8 GB)" >> "$GITHUB_STEP_SUMMARY"
          echo "RAM: ${RAM_GB} GB"
          echo "CPU: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown)"
          echo "Free disk:"; df -h / | tail -1
          swift --version || true
          xcodebuild -version || true
          echo "Metal / GPU:"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -iE 'Chipset|Vendor|Metal|Device' || echo "  (no SPDisplaysDataType output)"
          if [ "$RAM_GB" -lt 8 ]; then
            echo "- ⚠️ **Runner RAM is below PixArt's 8 GB gate — memory-gated checkpoints may fail.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute model cache key (PixArt CDN manifests)
        run: |
          BASE="https://pub-8e049ed02be340cbb18f921765fd24f3.r2.dev/models"
          : > pixart-manifests.lock
          for slug in \
            intrusive-memory_t5-xxl-int4-mlx \
            intrusive-memory_pixart-sigma-xl-dit-int4-mlx \
            intrusive-memory_sdxl-vae-fp16-mlx ; do
            CK=$(curl -sf "$BASE/$slug/manifest.json" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('manifestChecksum',''))")
            echo "$slug=$CK" >> pixart-manifests.lock
          done
          echo "Cache key inputs:"; cat pixart-manifests.lock

      - name: Restore PixArt model cache
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.MODELS_DIR }}
          key: pixart-models-v1-${{ hashFiles('pixart-manifests.lock') }}

      - name: Build vinetas CLI
        run: make build

      - name: Download PixArt models from CDN (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ACERVO_MODELS_DIR: ${{ env.MODELS_DIR }}
        run: |
          mkdir -p "$MODELS_DIR"
          ./bin/vinetas download --model pixart-sigma
          echo "Downloaded model tree:"
          du -sh "$MODELS_DIR"/* 2>/dev/null || true

      - name: Run PixArt integration (compile + real-model fetch; GPU checkpoints skipped)
        run: |
          mkdir -p build
          # Whole PixArtIntegrationTests suite at the suite level (function-level
          # -only-testing is unreliable for swift-testing @Test funcs and silently
          # matches zero tests). VINETAS_CI_SKIP_GPU=1 disables the .gpu generation
          # checkpoints (3/4) via .enabled(if:) traits — they report as skipped,
          # not failed — so Checkpoints 1 (compile) and 2 (real-model download +
          # manifest verify + pipeline assembly) actually run and gate.
          TEST_RUNNER_ACERVO_APP_GROUP_ID=group.intrusive-memory.models \
          TEST_RUNNER_ACERVO_CDN_BASE_URL=https://cdn.intrusive-memory.productions/models \
          TEST_RUNNER_ACERVO_MODELS_DIR="$MODELS_DIR" \
          TEST_RUNNER_VINETAS_TEST_IGNORE_MEMORY_GATE=1 \
          TEST_RUNNER_VINETAS_CI_SKIP_GPU=1 \
          xcodebuild test \
            -scheme SwiftVinetas-Package \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -only-testing:SwiftVinetasGPUTests/PixArtIntegrationTests \
            2>&1 | tee build/pixart-integration.log; exit ${PIPESTATUS[0]}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixart-integration-log
          path: build/pixart-integration.log
          retention-days: 7
