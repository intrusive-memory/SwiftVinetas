name: Tests

on:
  pull_request:
    branches: [main, development]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme SwiftVinetas-Package

      - name: Run unit tests
        run: xcodebuild test -scheme SwiftVinetas-Package -destination 'platform=macOS'
