name: Tests

on:
  pull_request:
    branches: [main, development]
    # ready_for_review is NOT in GitHub's default event set. Without it, promoting
    # a draft PR never starts this suite. Draft PRs still receive opened/synchronize
    # events, but every job below skips on `!draft` — a draft is a workspace, a
    # ready PR is a merge request (see the draft-pr-ci-gate skill / AGENTS.md).
    types: [opened, synchronize, reopened, ready_for_review]

env:
  ACERVO_APP_GROUP_ID: group.intrusive-memory.models

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (macOS)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test-unit

      - name: Check for SwiftAcervo regression warnings
        if: always()
        run: |
          LOG=build/test-output.log
          if [ ! -f "$LOG" ]; then
            echo "ERROR: $LOG not found — test step did not produce a log file."
            echo "See: docs/complete/SWIFTACERVO_MANIFEST_MIGRATION.md § R7.1"
            exit 1
          fi
          if grep -qE '\[SwiftAcervo\] Warning: re-registering component|\[SwiftAcervo\] Manifest drift detected' "$LOG"; then
            echo ""
            echo "FAIL: SwiftAcervo regression warning detected in $LOG:"
            grep -E '\[SwiftAcervo\] Warning: re-registering component|\[SwiftAcervo\] Manifest drift detected' "$LOG"
            echo ""
            echo "A component was registered with a hardcoded 'files:' list, or the CDN manifest"
            echo "disagrees with the registered file list. Fix the registration and re-run tests."
            echo "See: docs/complete/SWIFTACERVO_MANIFEST_MIGRATION.md § R7.1"
            exit 1
          fi
          echo "OK: no SwiftAcervo regression warnings in $LOG"

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests completed" >> $GITHUB_STEP_SUMMARY
