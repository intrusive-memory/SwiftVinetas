name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.10.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: vinetas
  SCHEME: vinetas

jobs:
  build-and-release:
    name: Build Release Binary
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag: $TAG)"

      - name: Show Swift version
        run: swift --version

      - name: Build release binary
        run: make release

      - name: Verify binary exists
        run: |
          test -f ./bin/vinetas
          test -d ./bin/mlx-swift_Cmlx.bundle
          test -f ./bin/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib
          echo "Binary and Metal bundle verified."

      - name: Package tarball
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="vinetas-${VERSION}-arm64-macos.tar.gz"
          cd bin
          tar czf "../${TARBALL}" vinetas mlx-swift_Cmlx.bundle
          cd ..
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packaged: $TARBALL"
          ls -lh "$TARBALL"

      - name: Compute SHA256
        id: sha256
        run: |
          TARBALL="${{ steps.package.outputs.tarball }}"
          SHA=$(shasum -a 256 "$TARBALL" | awk '{ print $1 }')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"
          echo "$SHA  $TARBALL" > "${TARBALL}.sha256"

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: vinetas-release
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256

      - name: Trigger Homebrew Tap Update
        if: github.event_name == 'release'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: intrusive-memory/homebrew-tap
          event-type: formula-update
          client-payload: |
            {
              "formula": "vinetas",
              "version": "${{ steps.version.outputs.tag }}",
              "repo": "${{ github.repository }}"
            }
